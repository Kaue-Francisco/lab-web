<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>CRUD Operations</h1>
        <h3>Abre o Console para visualizar os resultados</h3>
    </header>
    <main>
        <section id="create">
            <h2>Create</h2>
            <form id="create-form">
                <label for="create-name">Name:</label>
                <input type="text" id="create-name" name="name" required>
                <label for="create-age">Age:</label>
                <input type="number" id="create-age" name="age" required>
                <button type="submit">Create</button>
            </form>
        </section>
        
        <section id="read">
            <h2>Read</h2>
            <form id="read-form">
                <label for="read-id">ID:</label>
                <input type="text" id="read-id" name="id" required>
                <button type="submit">Read</button>
            </form>
        </section>
        
        <section id="update">
            <h2>Update</h2>
            <form id="update-form">
                <label for="update-id">ID:</label>
                <input type="text" id="update-id" name="id" required>
                <label for="update-name">New Name:</label>
                <input type="text" id="update-name" name="name" required>
                <label for="update-name">New Age:</label>
                <input type="number" id="update-age" name="age" required>
                <button type="submit">Update</button>
            </form>
        </section>
        
        <section id="delete">
            <h2>Delete</h2>
            <form id="delete-form">
                <label for="delete-id">ID:</label>
                <input type="text" id="delete-id" name="id" required>
                <button type="submit">Delete</button>
            </form>
        </section>
    </main>
    <script>
        async function sendRequest(url, method, data) {
            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                console.log(result);
            } catch (error) {
                console.error('Erro na requisição:', error);
            }
        }

        document.getElementById('create-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const data = {
                name: document.getElementById('create-name').value,
                age: parseInt(document.getElementById('create-age').value, 10)
            };
            sendRequest('/create-user', 'POST', data);
        });

        document.getElementById('read-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const id = document.getElementById('read-id').value;
            
            fetch(`/users/${encodeURIComponent(id)}`, { method: 'GET' })
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(error => console.error('Erro na requisição:', error));
        });

        document.getElementById('update-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const id = document.getElementById('update-id').value;
            const data = { name: document.getElementById('update-name').value, age: parseInt(document.getElementById('update-age').value, 10) };
            sendRequest(`/users/${encodeURIComponent(id)}`, 'PUT', data);
        });

        document.getElementById('delete-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const id = document.getElementById('delete-id').value;
            fetch(`/users/${encodeURIComponent(id)}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => console.log(data))
                .catch(error => console.error('Erro na requisição:', error));
        });
    </script>
</body>
</html>
